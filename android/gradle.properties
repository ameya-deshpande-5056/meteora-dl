# Tuned for minimal RAM usage when building APKs on an 8GB RAM Windows 11 system
# alongside browsers and Electron apps.

# Single-JVM Gradle Daemon with minimal heap/metaspace and SerialGC (lowest native RAM overhead)
org.gradle.jvmargs=-Xmx1024m -Xms128m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=96m -XX:+UseSerialGC -Dfile.encoding=UTF-8

# Run Kotlin compiler inside the Gradle JVM instead of spawning a second Kotlin Daemon JVM
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

# Strictly limit to 1 worker and serial subproject execution to minimize peak RAM spikes
org.gradle.workers.max=1
org.gradle.parallel=false

# Keep daemon for incremental speed, but exit after 3 min idle to return RAM to Windows
org.gradle.daemon=true
org.gradle.daemon.idletimeout=180000
org.gradle.caching=true
org.gradle.vfs.watch=true

# Android Gradle Plugin (AGP) memory & build optimizations
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true
