name: meteora
description: "High-performance, lightweight Android media downloader powered by yt-dlp."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  path_provider: ^2.1.5
  media_engine:
    path: packages/media_engine
  package_manager:
    path: packages/package_manager
  media_library:
    path: packages/media_library
  sqlite3_flutter_libs: ">=0.5.24 <0.6.0"
  dynamic_color: 1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
